[project]
name = "afr-api"
version = "0.1.0"
description = "Agent Flight Recorder — FastAPI backend (VideoDB hackathon)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "redis>=5.2.0",
    "videodb[capture,websockets]>=0.2.0",
    "anthropic>=0.40.0",
    "supabase>=2.10.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
